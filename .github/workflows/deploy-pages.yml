name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site config
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Clone actual GitHub Wiki
        shell: bash
        run: |
          rm -rf wiki-source .pages-docs site
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-source

      - name: Prepare Wiki pages
        shell: bash
        run: |
          mkdir -p .pages-docs
          find wiki-source -maxdepth 1 -type f -name '*.md' \
            ! -name '_Sidebar.md' ! -name '_Footer.md' ! -name '_Header.md' \
            -exec cp {} .pages-docs/ \;

          if [ -f '.pages-docs/Home.md' ]; then
            cp '.pages-docs/Home.md' '.pages-docs/index.md'
          else
            first_page="$(find .pages-docs -maxdepth 1 -type f -name '*.md' | head -n 1)"
            if [ -n "$first_page" ]; then
              cp "$first_page" '.pages-docs/index.md'
            else
              printf '# Cardputer ADV 中文 Wiki\n' > .pages-docs/index.md
            fi
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          root = Path('.pages-docs')

          level1 = [
              ('WiFi', '无线网络'),
              ('BLE', '低功耗蓝牙'),
              ('RF', '射频 / Sub-GHz'),
              ('NRF24', 'NRF24 2.4GHz 无线'),
              ('LoRa', '远距离无线通信'),
              ('FM', '调频广播'),
              ('IR', '红外'),
              ('Ethernet', '有线网络'),
              ('GPS', '卫星定位'),
              ('RFID', '射频识别 / NFC'),
              ('Files', '文件管理'),
              ('Scripts', '脚本'),
              ('Clock', '时钟'),
              ('Others', '其他工具'),
              ('Config', '系统设置'),
          ]

          zh = {
              # 一级菜单
              **dict(level1),

              # WiFi 二级菜单（Bruce 1.16.1 实机英文原名）
              'Connect to Wifi': '连接到 Wi-Fi',
              'Start WiFi AP': '启动 Wi-Fi 热点',
              'Turn Off WiFi': '关闭 Wi-Fi',
              'AP info': '当前热点信息',
              'Wifi Atks': 'Wi-Fi 测试工具',
              'Evil Portal': '模拟门户页面',
              'NetCut': '局域网连接控制测试',
              'Listen TCP': 'TCP 监听',
              'Client TCP': 'TCP 客户端',
              'SOCKS4 Proxy': 'SOCKS4 代理',
              'TelNET': 'Telnet 终端',
              'SSH': 'SSH 终端',
              'Sniffer': '数据包监听',
              'Channel Analyzer': '信道分析器',
              'Jam Detect': '干扰检测',
              'Scan Hosts': '扫描局域网主机',
              'Wireguard': 'WireGuard VPN',
              'Responder': '网络响应测试',
              'Brucegotchi': 'Brucegotchi 模式',
              'WiFi Pass Recovery': 'Wi-Fi 密码恢复工具',

              # WiFi 三级菜单
              'Target Atks': '目标网络测试',
              'Information': '信息',
              'Deauth': '断开连接测试',
              'Capture Handshake': '抓取握手数据',
              'Clone Portal': '克隆门户页面',
              'Deauth+Clone': '断开测试 + 克隆门户',
              'Deauth+Clone+Verify': '断开测试 + 克隆门户 + 验证',
              'Karma Attack': 'Karma 测试',
              'Beacon SPAM': 'Beacon 广播测试',
              'Funny SSID': '趣味 SSID',
              'Ricky Roll': 'Rickroll SSID',
              'Random SSID': '随机 SSID',
              'Single SSID': '单个 SSID',
              'Custom SSIDs': '自定义 SSID',
              'Deauth Flood': '批量断开连接测试',
              'Enhanced Deauth': '增强断开连接测试',
              'Station Deauth (Single)': '单个客户端断开测试',
              'Deauth All Clients': '全部客户端断开测试',
              'Deauth Target List': '目标列表断开测试',

              # BLE 常见菜单
              'BLE Scan': '蓝牙扫描',
              'BLE Spam': 'BLE 广播测试',
              'BLE Suite': 'BLE 工具套件',
              'Media Cmds': '媒体控制命令',
              'iBeacon': 'iBeacon 广播',
              'Bad BLE': 'BLE 测试工具',
              'BLE Keyboard': 'BLE 键盘',
              'Ninebot': 'Ninebot 工具',
              'Presenter mode': '演示器模式',
              'Apple Pairing Prompt': 'Apple 配对提示',
              'Apple Action Modal': 'Apple 操作弹窗',
              'Apple Not Your Device': 'Apple 非本机设备提示',
              'Android Device Alert': 'Android 设备提示',
              'Windows Swift Pair': 'Windows 快速配对',
              'Samsung BLE Spam': 'Samsung BLE 广播测试',
              'BLE Beacon Spam': 'BLE Beacon 广播测试',
              'Random / All': '随机 / 全部',

              # LoRa / GPS / Files / Config 常见菜单
              'Chat': '聊天',
              'Change username': '修改用户名',
              'Change Frequency': '修改频率',
              'Wardriving': '巡航扫描记录',
              'GPS Tracker': 'GPS 轨迹记录',
              'SD Card': 'SD 卡',
              'LittleFS': '内部文件系统',
              'WebUI': '网页管理界面',
              'Connect': '设备互联',
              'Mass Storage': 'USB 大容量存储',
              'Display & UI': '显示与界面',
              'LED Config': 'LED 设置',
              'Audio Config': '音频设置',
              'System Config': '系统设置',
              'Power': '电源',
              'Install App Store': '安装应用商店',
              'Dev Mode': '开发者模式',
              'About': '关于',
              'Main Menu': '主菜单',
              'Back': '返回',
          }

          def slug(text: str) -> str:
              s = unicodedata.normalize('NFKD', text).encode('ascii', 'ignore').decode().lower()
              s = re.sub(r'[^a-z0-9]+', '-', s).strip('-')
              return s or 'section'

          def bilingual(text: str) -> str:
              key = text.strip()
              if key in zh and '（' not in key:
                  return f'{key}（{zh[key]}）'
              return text

          # 转 GitHub Wiki 链接语法。
          for p in root.glob('*.md'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'\[\[([^\]|]+)\|([^\]]+)\]\]', lambda m: f'[{m.group(1)}]({m.group(2)}.md)', text)
              text = re.sub(r'\[\[([^\]|]+)\]\]', lambda m: f'[{m.group(1)}]({m.group(1)}.md)', text)
              p.write_text(text, encoding='utf-8')

          # 关键修正：代码块里的菜单树也改成“英文（中文）”。
          # 这正是页面上 WiFi ├─ Connect to Wifi ... 那一块。
          for p in root.glob('*.md'):
              lines = p.read_text(encoding='utf-8').splitlines()
              out = []
              in_fence = False
              for line in lines:
                  if line.lstrip().startswith('```'):
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if in_fence:
                      m = re.match(r'^([\s│├└─]*)([^│├└─].*?)\s*$', line)
                      if m:
                          prefix, label = m.groups()
                          label = label.strip()
                          if label in zh:
                              line = prefix + f'{label}（{zh[label]}）'
                      out.append(line)
                      continue
                  out.append(line)
              p.write_text('\n'.join(out) + '\n', encoding='utf-8')

          # 标题里的菜单名也统一显示中英对照，并生成锚点供跳转。
          page_sections = {}
          for p in root.glob('*.md'):
              if p.name == 'index.md':
                  continue
              lines = p.read_text(encoding='utf-8').splitlines()
              out = []
              sections = []
              in_fence = False
              used = {}
              for line in lines:
                  if line.lstrip().startswith('```'):
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if in_fence:
                      out.append(line)
                      continue
                  m = re.match(r'^(#{1,6})\s+(.+?)\s*$', line)
                  if not m:
                      out.append(line)
                      continue
                  marks, raw = m.groups()
                  raw = re.sub(r'\s*\{#[^}]+\}\s*$', '', raw).strip()
                  base_key = raw
                  old = re.match(r'^(.*?)[（(][^()（）]+[）)]$', raw)
                  if old and old.group(1).strip() in zh:
                      base_key = old.group(1).strip()
                  if base_key not in zh:
                      out.append(line)
                      continue
                  base = 'menu-' + slug(base_key)
                  used[base] = used.get(base, 0) + 1
                  anchor = base if used[base] == 1 else f'{base}-{used[base]}'
                  out.append(f'{marks} {base_key}（{zh[base_key]}） {{#{anchor}}}')
                  sections.append((len(marks), base_key, zh[base_key], anchor))
              p.write_text('\n'.join(out) + '\n', encoding='utf-8')
              page_sections[p.name] = sections

          # 首页增加可点击的一级菜单入口。
          index = root / 'index.md'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              marker = '<!-- BRUCE_BILINGUAL_MENU -->'
              if marker not in text:
                  block = ['', marker, '', '## Bruce 一级菜单 / Main Menu', '']
                  files = list(root.glob('*.md'))
                  for eng, cn in level1:
                      candidates = [x for x in files if eng.lower() in x.stem.lower() and 'bruce' in x.stem.lower()]
                      if candidates:
                          dest = candidates[0].name
                      else:
                          dest = f'Bruce-完整菜单导航.md#menu-{slug(eng)}'
                      block.append(f'- [{eng}（{cn}）]({dest})')
                  text += '\n' + '\n'.join(block) + '\n'
                  index.write_text(text, encoding='utf-8')

          # 生成一份完整、可点击的一级菜单页。
          nav = ['# Bruce 完整菜单导航 / Full Menu', '', '> 菜单英文与 Bruce 实机保持一致，中文放在英文后方。', '']
          files = list(root.glob('*.md'))
          for eng, cn in level1:
              candidates = [x for x in files if eng.lower() in x.stem.lower() and 'bruce' in x.stem.lower()]
              dest = candidates[0].name if candidates else '#'
              nav.append(f'## {eng}（{cn}） {{#menu-{slug(eng)}}}')
              nav.append('')
              if dest != '#':
                  nav.append(f'[进入 {eng}（{cn}）详细说明 →]({dest})')
              nav.append('')
          (root / 'Bruce-完整菜单导航.md').write_text('\n'.join(nav) + '\n', encoding='utf-8')
          PY

      - name: Build site
        run: mkdocs build --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
