name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Prepare docs
        shell: bash
        run: |
          rm -rf .pages-docs site
          mkdir -p .pages-docs
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            mkdir -p ".pages-docs/$(dirname "$rel")"
            cp "$file" ".pages-docs/$rel"
          done < <(find . -type f -name '*.md' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './.pages-docs/*' \
            -not -path './site/*' -print0)

          if [ -f '.pages-docs/00-首页.md' ]; then
            cp '.pages-docs/00-首页.md' '.pages-docs/index.md'
          elif [ -f '.pages-docs/README.md' ]; then
            cp '.pages-docs/README.md' '.pages-docs/index.md'
          else
            printf '# Cardputer ADV 中文 Wiki\n' > .pages-docs/index.md
          fi

      - name: Build site
        run: mkdocs build --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
