name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site config
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Clone actual GitHub Wiki
        shell: bash
        run: |
          rm -rf wiki-source .pages-docs site
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-source

      - name: Prepare Wiki pages
        shell: bash
        run: |
          mkdir -p .pages-docs
          find wiki-source -maxdepth 1 -type f -name '*.md' \
            ! -name '_Sidebar.md' ! -name '_Footer.md' ! -name '_Header.md' \
            -exec cp {} .pages-docs/ \;

          if [ -f '.pages-docs/Home.md' ]; then
            cp '.pages-docs/Home.md' '.pages-docs/index.md'
          else
            first_page="$(find .pages-docs -maxdepth 1 -type f -name '*.md' | head -n 1)"
            if [ -n "$first_page" ]; then
              cp "$first_page" '.pages-docs/index.md'
            else
              printf '# Cardputer ADV 中文 Wiki\n\n未找到 GitHub Wiki 页面。\n' > .pages-docs/index.md
            fi
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.pages-docs')
          for p in root.glob('*.md'):
              text = p.read_text(encoding='utf-8')
              # GitHub Wiki: [[Label|Page]] -> [Label](Page.md)
              text = re.sub(r'\[\[([^\]|]+)\|([^\]]+)\]\]', lambda m: f'[{m.group(1)}]({m.group(2)}.md)', text)
              # GitHub Wiki: [[Page]] -> [Page](Page.md)
              text = re.sub(r'\[\[([^\]|]+)\]\]', lambda m: f'[{m.group(1)}]({m.group(1)}.md)', text)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Build site
        run: mkdocs build --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
